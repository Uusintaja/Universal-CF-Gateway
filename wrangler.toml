name = "universal-cf-gateway-mvp"
main = "src/index.ts"
compatibility_date = "2024-07-01"
compatibility_flags = ["nodejs_compat"]

# Phase 1 scope: high-priority sync path does NOT need Queues (per DESIGN-DOC Phasing)
# Queues are Phase 3 (low-priority batch). Keep commented as placeholder for Phase 3.
# To enable Phase 3, uncomment and run: wrangler queues create slack-webhook
# [[queues.producers]]
# queue = "slack-webhook"
# binding = "Q_SLACK"
# [[queues.consumers]]
# queue = "slack-webhook"
# max_batch_size = 5
# max_batch_timeout = 60
# max_retries = 3

[durable_objects]
bindings = [
  { name = "COORDINATOR", class_name = "CoordinatorDO" }
]

[[migrations]]
tag = "v1"
new_classes = ["CoordinatorDO"]

[[kv_namespaces]]
binding = "KV"
id = "local-kv-placeholder"


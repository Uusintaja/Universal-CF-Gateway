name = "universal-cf-gateway-mvp-experimental"
main = "src/index.ts"
compatibility_date = "2024-07-01"
compatibility_flags = ["nodejs_compat"]

# Phase 3A scope: Queues low-priority batch (happy path)
# - Worker name includes experimental per user request
# - Queues must be created before deploy: wrangler queues create <name>-experimental
# - DO binding kept for dedup/lane/circuit

[[queues.producers]]
queue = "slack-webhook-experimental"
binding = "Q_SLACK_EXP"

[[queues.producers]]
queue = "email-experimental"
binding = "Q_EMAIL_EXP"

[[queues.producers]]
queue = "webhook-experimental"
binding = "Q_WEBHOOK_EXP"

[[queues.consumers]]
queue = "slack-webhook-experimental"
max_batch_size = 5
max_batch_timeout = 60
max_retries = 3

[[queues.consumers]]
queue = "email-experimental"
max_batch_size = 5
max_batch_timeout = 60
max_retries = 3

[[queues.consumers]]
queue = "webhook-experimental"
max_batch_size = 5
max_batch_timeout = 60
max_retries = 3

[durable_objects]
bindings = [
  { name = "COORDINATOR", class_name = "CoordinatorDO" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CoordinatorDO"]

# KV for cold query cache - Phase 3B - now enabled with real id per user creation
[[kv_namespaces]]
binding = "KV"
id = "e7e370065f37457f8cebb76550ad8a59"

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

